<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DannyWash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app">
      <section id="summon" class="screen screen--summon" aria-label="Summon Danny">
        <div class="summon__atmosphere" aria-hidden="true"></div>
        <button type="button" id="come-btn" class="come-btn" aria-label="Come to Wash">
          <span class="come-btn__sheen" aria-hidden="true"></span>
          <span class="come-btn__rim" aria-hidden="true"></span>
          <span class="come-btn__face">
            <span class="come-btn__label">Come to Wash</span>
          </span>
        </button>
        <button type="button" id="try-crash-btn" class="try-crash-btn">Try crash</button>
      </section>

      <section id="map" class="screen screen--map" hidden aria-label="Danny en route">
        <div class="map-frame">
          <p id="status" class="status">Danny is coming to wash!</p>
          <div class="map-canvas" id="map-canvas" aria-hidden="true">
            <svg class="map-grid" viewBox="0 0 100 100" preserveAspectRatio="none">
              <defs>
                <pattern id="blocks" width="12" height="12" patternUnits="userSpaceOnUse">
                  <rect width="12" height="12" fill="transparent" />
                  <rect x="1" y="1" width="4.5" height="3.2" rx="0.3" fill="rgba(40, 72, 58, 0.14)" />
                  <rect x="6.5" y="5.2" width="4.2" height="5" rx="0.3" fill="rgba(40, 72, 58, 0.1)" />
                  <rect x="1.5" y="7" width="3.8" height="3.5" rx="0.3" fill="rgba(40, 72, 58, 0.08)" />
                </pattern>
              </defs>
              <rect width="100" height="100" fill="url(#blocks)" />
              <g class="roads" stroke="rgba(255,255,255,0.55)" stroke-width="1.6" fill="none" stroke-linecap="round">
                <path d="M8 18 H92" />
                <path d="M8 42 H92" />
                <path d="M8 66 H92" />
                <path d="M8 88 H70" />
                <path d="M22 8 V92" />
                <path d="M48 8 V92" />
                <path d="M74 8 V78" />
                <path d="M8 42 L48 66" />
                <path d="M48 42 L92 18" />
              </g>
              <g class="road-dashes" stroke="rgba(232, 196, 90, 0.45)" stroke-width="0.35" stroke-dasharray="1.2 1.6">
                <path d="M8 18 H92" />
                <path d="M8 42 H92" />
                <path d="M8 66 H92" />
                <path d="M22 8 V92" />
                <path d="M48 8 V92" />
                <path d="M74 8 V78" />
              </g>
            </svg>

            <div class="you-pin" id="you-pin" style="left: 74%; top: 66%">
              <span class="you-pin__pulse"></span>
              <span class="you-pin__dot"></span>
              <span class="you-pin__label">You</span>
            </div>

            <div class="danny" id="danny" style="left: 22%; top: 88%">
              <img
                src="assets/danny.png"
                alt="Danny"
                class="danny__photo"
                width="96"
                height="96"
                draggable="false"
              />
              <span class="danny__ring"></span>
            </div>

            <svg class="trail" id="trail" viewBox="0 0 100 100" preserveAspectRatio="none">
              <path
                id="route"
                fill="none"
                stroke="rgba(20, 110, 90, 0.4)"
                stroke-width="0.85"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-dasharray="1.4 1.1"
              />
            </svg>
          </div>
        </div>
      </section>

      <section id="door" class="screen screen--door" hidden aria-label="Front door">
        <div class="door-scene" id="door-scene">
          <div class="door-behind" id="door-behind">
            <div class="door-danny-zoom" id="door-danny-zoom">
              <img
                class="door-danny"
                id="door-danny"
                src="assets/danny.png"
                alt="Danny"
                width="428"
                height="399"
                draggable="false"
              />
            </div>
            <img
              class="door-wave"
              id="door-wave"
              src="assets/wave-hand.png"
              alt=""
              width="128"
              height="128"
              draggable="false"
              hidden
              aria-hidden="true"
            />
          </div>
          <button type="button" id="door-btn" class="door-panel" aria-label="Open the door">
            <span class="door-panel__wood" aria-hidden="true"></span>
            <span class="door-panel__panels" aria-hidden="true"></span>
            <span class="door-panel__handle" aria-hidden="true"></span>
          </button>
          <p id="door-hello" class="door-hello" aria-hidden="true">Hello!</p>
        </div>
        <p id="danny-left" class="danny-left" hidden>Danny left.</p>
      </section>

      <section id="died" class="screen screen--died" hidden aria-label="Danny has died">
        <p id="died-crash-line" class="died-crash-line">Danny has crashed</p>
        <div class="died-face-wrap" aria-hidden="true">
          <img
            class="died-face"
            id="died-face"
            src="assets/danny.png"
            alt=""
            width="428"
            height="399"
            draggable="false"
          />
        </div>
        <div class="died-bottom">
          <p class="died-message">Danny has died.</p>
          <button type="button" id="flowers-btn" class="flowers-btn" aria-label="Send flowers">
            <span class="flowers-btn__rim" aria-hidden="true"></span>
            <span class="flowers-btn__face">
              <span class="flowers-btn__label">Send flowers</span>
            </span>
            <span class="flowers-btn__sheen" aria-hidden="true"></span>
          </button>
        </div>
        <div class="died-coffin" id="died-coffin">
          <svg class="died-coffin__svg" viewBox="0 0 300 520" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="coffinWood" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#3a2418" />
                <stop offset="40%" stop-color="#1a100c" />
                <stop offset="100%" stop-color="#080504" />
              </linearGradient>
              <linearGradient id="coffinEdge" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#5c3c28" />
                <stop offset="50%" stop-color="#2a1812" />
                <stop offset="100%" stop-color="#100806" />
              </linearGradient>
            </defs>
            <!-- Oversized coffin: wood fills the whole viewBox; \ / sides still read on screen -->
            <path
              fill="url(#coffinEdge)"
              d="M78 -110 L222 -110 L430 125 L350 640 L-50 640 L-130 125 Z"
            />
            <path
              fill="url(#coffinWood)"
              d="M88 -90 L212 -90 L410 130 L335 620 L-35 620 L-110 130 Z"
            />
            <!-- Grain -->
            <g fill="none" stroke="#5f412a" stroke-opacity="0.32" stroke-width="1.6" stroke-linecap="round">
              <path d="M20 70 C100 105, 200 100, 280 65" />
              <path d="M-10 150 C90 190, 210 185, 310 145" />
              <path d="M5 250 C100 290, 200 285, 295 245" />
              <path d="M20 350 C105 385, 195 380, 280 345" />
              <path d="M40 450 C110 480, 190 475, 260 445" />
              <path d="M150 -20 C155 140, 160 300, 150 520" stroke-opacity="0.5" />
            </g>
            <!-- T-cross dead center -->
            <g transform="translate(150 260)" fill="#8c643f">
              <rect x="-14" y="-78" width="28" height="156" rx="3" />
              <rect x="-58" y="-42" width="116" height="26" rx="3" />
            </g>
          </svg>
          <div class="died-coffin__blackout" aria-hidden="true"></div>
        </div>
        <div id="flower-bursts" class="tip-bursts" aria-hidden="true"></div>
      </section>

      <section id="wash" class="screen screen--wash" hidden aria-label="Danny washing">
        <div class="wash-content">
          <img
            class="wash-gif"
            id="wash-gif"
            src="assets/washing.gif"
            alt="Danny washing the dishes"
            width="330"
            height="388"
            draggable="false"
            tabindex="0"
            role="button"
            aria-label="Play Danny tip line"
          />
          <p class="wash-caption">Danny is washing</p>
          <button type="button" id="tip-btn" class="tip-btn" aria-label="Give 6 cents">
            <span class="tip-btn__rim" aria-hidden="true"></span>
            <span class="tip-btn__face">
              <span class="tip-btn__label">give 6 cents</span>
            </span>
            <span class="tip-btn__sheen" aria-hidden="true"></span>
          </button>
          <p id="tip-total" class="tip-total" aria-live="polite">$0.00 given</p>
          <div id="tip-bursts" class="tip-bursts" aria-hidden="true"></div>
        </div>
      </section>

      <section id="bye" class="screen screen--bye" hidden aria-label="Goodbye">
        <div class="bye-content">
          <img
            class="bye-photo"
            src="assets/danny.png"
            alt="Danny"
            width="428"
            height="399"
            draggable="false"
          />
          <p id="bye-total" class="bye-total">$0.00 tipped</p>
          <button type="button" id="bye-btn" class="come-btn bye-btn" aria-label="Goodbye">
            <span class="come-btn__sheen" aria-hidden="true"></span>
            <span class="come-btn__rim" aria-hidden="true"></span>
            <span class="come-btn__face">
              <span class="come-btn__label">Goodbye</span>
            </span>
          </button>
        </div>
      </section>

      <section id="rate" class="screen screen--rate" hidden aria-label="Rate Danny">
        <div class="rate-content">
          <div id="rate-form" class="rate-form">
            <h2 class="rate-title">Rate DannyWash</h2>
            <div id="rate-stars" class="rate-stars" role="group" aria-label="Star rating">
              <button type="button" class="rate-star" data-star="1" aria-label="1 star">★</button>
              <button type="button" class="rate-star" data-star="2" aria-label="2 stars">★</button>
              <button type="button" class="rate-star" data-star="3" aria-label="3 stars">★</button>
              <button type="button" class="rate-star" data-star="4" aria-label="4 stars">★</button>
              <button type="button" class="rate-star" data-star="5" aria-label="5 stars">★</button>
            </div>
            <label class="rate-comment-label" for="rate-comment">Comment</label>
            <textarea
              id="rate-comment"
              class="rate-comment"
              rows="3"
              maxlength="280"
              placeholder="How was your wash?"
            ></textarea>
            <button type="button" id="rate-submit" class="rate-submit" disabled>Submit</button>
          </div>
          <div id="rate-outcome" class="rate-outcome" hidden>
            <p id="rate-rejected" class="rate-rejected" hidden>Rejected.</p>
            <p id="rate-thanks" class="rate-thanks" hidden>
              <span class="rate-thanks__check" aria-hidden="true">✓</span>
              <span class="rate-thanks__text">Thanks for your comment</span>
            </p>
          </div>
        </div>
        <div id="rate-burst" class="rate-burst" aria-hidden="true"></div>
      </section>
    </main>
    <audio
      id="doorbell-audio"
      src="assets/doorbell.mp3"
      preload="auto"
      playsinline
    ></audio>

      preload="auto"

      preload="auto"

    ></audio>
    <audio

      src="assets/washing.mp3"
      preload="auto"

    ></audio>
    <audio

    ></audio>
    <audio

    <audio
      id="hello2-audio"

      preload="auto"
      playsinline
    ></audio>
    <audio
      id="goodbye-audio"
      src="assets/goodbye.mp3"
      preload="auto"
      playsinline
    ></audio>
    <audio
      id="goodbye-lowtip-audio"
      src="assets/goodbye-lowtip.mp3"
      preload="auto"
      playsinline
    ></audio>
    <audio
      id="lowtip-audio"
      src="assets/lowtip.mp3"
      preload="auto"
      playsinline
    ></audio>
    <audio
      id="hightip-audio"
      src="assets/hightip.mp3"
      preload="auto"
      playsinline
    ></audio>
    <audio
      id="hightip2-audio"
      src="assets/hightip2.mp3"
      preload="auto"
      playsinline
    ></audio>
    <audio
      id="slam-audio"
      src="assets/slam.mp3"
      preload="auto"
      playsinline
    ></audio>
    <audio
      id="wash-line1-audio"
      src="assets/wash-line1.mp3"
      preload="auto"
      playsinline
    ></audio>
    <audio
      id="wash-line2-audio"
      src="assets/wash-line2.mp3"
      preload="auto"

    <audio
      id="arrive-audio"
      src="assets/arrive.mp3"

    <audio
      id="door-knock-audio"
      src="assets/door-knock.mp3"

    <audio
      id="open-door-audio"
      src="assets/open-door.mp3"

    <audio
      id="crash-audio"

    <audio

    <audio

    <audio

    <script src="app.js"></script>
  </body>
</html>
