<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Coffin tuner — DannyWash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Tuner-only chrome — preview uses the real death-screen CSS */
      .tune-back {
        position: fixed;
        top: max(0.75rem, env(safe-area-inset-top));
        left: max(0.75rem, env(safe-area-inset-left));
        z-index: 30;
        text-decoration: none;
        color: rgba(242, 235, 227, 0.7);
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 0.45rem 0.7rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(12, 10, 9, 0.92);
      }

      .tune-panel {
        position: fixed;
        left: max(0.75rem, env(safe-area-inset-left));
        right: max(0.75rem, env(safe-area-inset-right));
        bottom: max(0.75rem, env(safe-area-inset-bottom));
        z-index: 30;
        max-width: 420px;
        margin-inline: auto;
        padding: 0.9rem 1rem 1rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        background: rgba(12, 10, 9, 0.92);
        backdrop-filter: blur(14px);
        color: #f2ebe3;
        font-family: "Bricolage Grotesque", sans-serif;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }

      .tune-panel.is-hidden {
        display: none;
      }

      .tune-panel h1 {
        margin: 0 0 0.15rem;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .tune-panel > p {
        margin: 0 0 0.85rem;
        font-size: 0.75rem;
        color: rgba(242, 235, 227, 0.62);
      }

      .tune-row {
        display: grid;
        grid-template-columns: 64px 1fr 58px;
        gap: 0.55rem;
        align-items: center;
        margin-bottom: 0.55rem;
      }

      .tune-row label {
        font-size: 0.72rem;
        color: rgba(242, 235, 227, 0.62);
      }

      .tune-row input[type="range"] {
        width: 100%;
        accent-color: #c4a07a;
      }

      .tune-row output {
        font-variant-numeric: tabular-nums;
        font-size: 0.72rem;
        text-align: right;
      }

      .tune-specs {
        margin: 0.65rem 0 0.7rem;
        padding: 0.65rem 0.7rem;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.03);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.68rem;
        line-height: 1.45;
        white-space: pre-wrap;
        color: #e8dccf;
      }

      .tune-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .tune-actions button {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: #f2ebe3;
        font: inherit;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 0.55rem 0.9rem;
        cursor: pointer;
      }

      .tune-actions button.primary {
        background: #c4a07a;
        border-color: transparent;
        color: #1a100c;
      }

      /* Match the closed death-screen coffin (no slide-in) */
      #died {
        display: block !important;
      }

      #died .died-coffin {
        transform: translateX(0);
        animation: none;
      }

      .tune-crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 4;
        width: 18px;
        height: 18px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        opacity: 0.55;
      }

      .tune-crosshair::before,
      .tune-crosshair::after {
        content: "";
        position: absolute;
        background: #ff4d4d;
      }

      .tune-crosshair::before {
        left: 50%;
        top: 0;
        width: 1px;
        height: 100%;
        transform: translateX(-50%);
      }

      .tune-crosshair::after {
        top: 50%;
        left: 0;
        width: 100%;
        height: 1px;
        transform: translateY(-50%);
      }
    </style>
  </head>
  <body>
    <a class="tune-back" href="index.html">← DannyWash</a>

    <div id="app">
      <section id="died" class="screen screen--died is-in" aria-label="Danny has died">
        <div class="died-face-wrap" aria-hidden="true" style="opacity: 1">
          <img
            class="died-face"
            src="assets/danny.png"
            alt=""
            width="428"
            height="399"
            draggable="false"
          />
          <div class="died-coffin is-closing" id="died-coffin">
            <img
              class="died-coffin__svg"
              id="coffin"
              src="assets/coffin.svg"
              alt=""
              width="300"
              height="520"
              draggable="false"
            />
          </div>
        </div>
        <div class="died-bottom" style="opacity: 1; transform: none">
          <p class="died-message">Danny has died.</p>
          <button type="button" class="flowers-btn" tabindex="-1" aria-hidden="true">
            <span class="flowers-btn__rim"></span>
            <span class="flowers-btn__face">
              <span class="flowers-btn__label">Send flowers</span>
            </span>
            <span class="flowers-btn__sheen"></span>
          </button>
        </div>
        <div class="tune-crosshair" aria-hidden="true"></div>
      </section>
    </div>

    <aside class="tune-panel" id="panel">
      <h1>Coffin tuner</h1>
      <p>
        Same death-screen CSS as the real app. Negative Y moves up. Hide the panel to judge the final
        frame, then copy specs.
      </p>

      <div class="tune-row">
        <label for="scale">Scale</label>
        <input id="scale" type="range" min="0.4" max="2.5" step="0.01" value="1.19" />
        <output id="scaleOut" for="scale">1.19</output>
      </div>
      <div class="tune-row">
        <label for="x">X</label>
        <input id="x" type="range" min="-40" max="40" step="0.5" value="0" />
        <output id="xOut" for="x">0.0%</output>
      </div>
      <div class="tune-row">
        <label for="y">Y</label>
        <input id="y" type="range" min="-40" max="40" step="0.5" value="-29.5" />
        <output id="yOut" for="y">-29.5%</output>
      </div>

      <pre class="tune-specs" id="specs"></pre>

      <div class="tune-actions">
        <button type="button" class="primary" id="copy">Copy specs</button>
        <button type="button" id="togglePanel">Hide panel</button>
        <button type="button" id="reset">Reset</button>
      </div>
    </aside>

    <script>
      const root = document.documentElement;
      const scaleEl = document.getElementById("scale");
      const xEl = document.getElementById("x");
      const yEl = document.getElementById("y");
      const scaleOut = document.getElementById("scaleOut");
      const xOut = document.getElementById("xOut");
      const yOut = document.getElementById("yOut");
      const specsEl = document.getElementById("specs");
      const copyBtn = document.getElementById("copy");
      const resetBtn = document.getElementById("reset");
      const panel = document.getElementById("panel");
      const togglePanel = document.getElementById("togglePanel");

      const defaults = { scale: 1.19, x: 0, y: -29.5 };

      function formatSpecs(scale, x, y) {
        return [
          `scale: ${scale.toFixed(2)}`,
          `x: ${x.toFixed(1)}%`,
          `y: ${y.toFixed(1)}%`,
          "",
          `--coffin-scale: ${scale.toFixed(2)};`,
          `--coffin-x: ${x.toFixed(1)}%;`,
          `--coffin-y: ${y.toFixed(1)}%;`,
          "",
          `transform: scale(${scale.toFixed(2)}) translate(${x.toFixed(1)}%, ${y.toFixed(1)}%);`,
          `transform-origin: center center;`,
          `object-fit: contain;`,
        ].join("\n");
      }

      function apply() {
        const scale = Number(scaleEl.value);
        const x = Number(xEl.value);
        const y = Number(yEl.value);

        root.style.setProperty("--coffin-scale", String(scale));
        root.style.setProperty("--coffin-x", `${x}%`);
        root.style.setProperty("--coffin-y", `${y}%`);

        scaleOut.textContent = scale.toFixed(2);
        xOut.textContent = `${x.toFixed(1)}%`;
        yOut.textContent = `${y.toFixed(1)}%`;
        specsEl.textContent = formatSpecs(scale, x, y);
      }

      for (const el of [scaleEl, xEl, yEl]) {
        el.addEventListener("input", apply);
      }

      resetBtn.addEventListener("click", () => {
        scaleEl.value = String(defaults.scale);
        xEl.value = String(defaults.x);
        yEl.value = String(defaults.y);
        apply();
      });

      togglePanel.addEventListener("click", () => {
        const hidden = panel.classList.toggle("is-hidden");
        togglePanel.textContent = hidden ? "Show panel" : "Hide panel";
        if (hidden) {
          const show = document.createElement("button");
          show.type = "button";
          show.id = "showPanelFab";
          show.textContent = "Show panel";
          show.style.cssText =
            "position:fixed;right:max(0.75rem,env(safe-area-inset-right));bottom:max(0.75rem,env(safe-area-inset-bottom));z-index:30;appearance:none;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(12,10,9,.92);color:#f2ebe3;font:700 0.75rem Bricolage Grotesque,sans-serif;padding:0.55rem 0.9rem;cursor:pointer";
          show.addEventListener("click", () => {
            panel.classList.remove("is-hidden");
            togglePanel.textContent = "Hide panel";
            show.remove();
          });
          document.body.appendChild(show);
        } else {
          document.getElementById("showPanelFab")?.remove();
        }
      });

      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(specsEl.textContent);
          copyBtn.textContent = "Copied";
          window.setTimeout(() => {
            copyBtn.textContent = "Copy specs";
          }, 1200);
        } catch {
          copyBtn.textContent = "Select & copy";
        }
      });

      apply();
    </script>
  </body>
</html>
